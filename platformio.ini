; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ------------------------------------------------------------------
; Shared configuration for every RaceLink Gateway hardware variant.
; Both supported boards are ESP32-S3 + SX1262 + SSD1306 and share an
; identical radio / OLED-I2C / Vext / button pin map. The only per-board
; difference is the OLED panel geometry, selected via OLED_GEOMETRY_* in
; the individual [env:*] blocks below.
; ------------------------------------------------------------------
[common]
;; ESP32-S3 development board, with 8MB FLASH and >= 8MB PSRAM (memory_type: qio_opi)
;;board = esp32-s3-devkitc-1 ;; generic dev board; the next line adds PSRAM support
;; Platform is pinned deliberately: releases ship a flashable factory image, which
;; bakes the partition layout and the bootloader offset into a published artifact.
;; An unpinned platform lets CI pick up a new default layout between two releases,
;; silently invalidating every flashing instruction that names an offset.
;; 7.0.1 is the version that built release v0.1.5 (framework-arduinoespressif32
;; 3.20017.241212, Arduino core 2.0.17) -- bump only together with a rebuild test.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
;; Explicit partition table, byte-identical to the Arduino default_8MB.csv this
;; project has always built with (verified against .pio/build/*/partitions.bin).
;; Committed rather than referenced by name so a platform update cannot redefine
;; it underneath us. app0 lives at 0x10000 -- see tests/test_partition_table.py.
partitions = partitions/racelink_gateway_8MB.csv
;;board_build.arduino.memory_type = qio_opi     ;; use with PSRAM: 8MB or 16MB
;;board_build.f_flash = 80000000L
;;board_build.flash_mode = qio

framework = arduino
;;monitor_speed = 921600
;;monitor_filters = esp32_exception_decoder
;;upload_protocol = esptool
;;upload_speed = 921600

lib_deps = jgromes/RadioLib @ ^7.4.0
    olikraus/U8g2 @ ^2.36.14

build_flags =
  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D ARDUINO_ARCH_ESP32S3
  -D CONFIG_IDF_TARGET_ESP32S3=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_DFU_ON_BOOT=0
  -D CO

  ;; ---RaceLink Device Type---
  -D DEV_TYPE=1 ;; device type number (1 = RaceLink_Gateway_v4, see RaceLinkProto::RL_Dev_Type*)
  -D DEV_TYPE_STR=\"RaceLink_Gateway_v4\"

  ;; Shared Heltec ESP32-S3 pin map (Wireless Stick V3 + WiFi LoRa 32 V4)
  -D PIN_VEXT=36
  ; --- Radio (SX1262) Pins ---
  -D RACELINK_SX1262
  -D RACELINK_CS=8
  -D RACELINK_SCK=9
  -D RACELINK_MOSI=10
  -D RACELINK_MISO=11
  -D RACELINK_RST=12
  -D RACELINK_BUSY=13
  -D RACELINK_DIO1=14

  ; --- I2C OLED Pins (SSD1306) ---
  -D OLED_SDA=17
  -D OLED_SCL=18
  -D OLED_RST=21
  ; Option: erneutes StartReceive nach jedem Paket (siehe Code)
  -D RX_STICKY=1

; ------------------------------------------------------------------
; Heltec Wireless Stick V3 — 0.49" 64x32 SSD1306 OLED
; ------------------------------------------------------------------
[env:WirelessStickV3-ESP32S3]
platform = ${common.platform}
board = ${common.board}
board_build.partitions = ${common.partitions}
framework = ${common.framework}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  ; --- OLED panel geometry: 0.49" 64x32 ---
  -D OLED_GEOMETRY_64X32=1

; ------------------------------------------------------------------
; Heltec WiFi LoRa 32 V4 (V4.3) — 0.96" 128x64 SSD1306 OLED
; Same ESP32-S3 + SX1262 + pin map as the Wireless Stick V3; the only
; difference is the larger OLED panel, handled in src/main.cpp via the
; OLED_GEOMETRY_128X64 layout. The V4 has 16MB flash / 2MB PSRAM, but the
; firmware fits comfortably in the generic esp32-s3-devkitc-1 8MB layout.
; ------------------------------------------------------------------
[env:HeltecWiFiLoRa32V4-ESP32S3]
platform = ${common.platform}
board = ${common.board}
board_build.partitions = ${common.partitions}
framework = ${common.framework}
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  ; --- OLED panel geometry: 0.96" 128x64 ---
  -D OLED_GEOMETRY_128X64=1
