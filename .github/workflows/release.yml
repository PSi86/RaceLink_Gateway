name: Release Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional gateway release version override. Leave empty to auto-increment."
        required: false
        default: ""
        type: string
      target_branch:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Space-separated list of PlatformIO environments to build and ship.
      RELEASE_ENVS: "WirelessStickV3-ESP32S3 HeltecWiFiLoRa32V4-ESP32S3"

    steps:
      - name: Check out RaceLink_Gateway repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve gateway release version
        id: release_version
        run: |
          version="$(python scripts/bump_release_version.py --version "${{ inputs.version }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release version and tag
        env:
          EXPECTED_VERSION: ${{ steps.release_version.outputs.version }}
          EXPECTED_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("version.json").read_text(encoding="utf-8"))
          version = str(payload["version"])
          expected_version = os.environ["EXPECTED_VERSION"]
          expected_tag = os.environ["EXPECTED_TAG"]
          derived_tag = f"v{version}"

          if version != expected_version:
              raise SystemExit(f"Release version mismatch: {version} != {expected_version}")
          if derived_tag != expected_tag:
              raise SystemExit(f"Release tag mismatch: {derived_tag} != {expected_tag}")
          PY

      - name: Fail if tag or release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags origin "${{ steps.release_version.outputs.tag }}" | grep -q "${{ steps.release_version.outputs.tag }}"; then
            echo "Tag ${{ steps.release_version.outputs.tag }} already exists on origin"
            exit 1
          fi
          if gh release view "${{ steps.release_version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.release_version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Run static release tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio
          # esptool 5 renamed merge_bin to merge-bin; pin the major so the
          # rename cannot break a release, and so the defaults the staging
          # script relies on (flash mode/freq/size = keep) stay put.
          python -m pip install "esptool>=5,<6"

      # Reports, per environment, the pre-application images and the offsets the
      # platform itself would flash them at. Reading them here rather than
      # hard-coding a per-SoC table means a new target needs no workflow change.
      #
      # Before the build, not after: `project metadata` cleans the build
      # directory whenever it changes PlatformIO's project checksum — resolving
      # a dependency the build had not is enough — which would delete the very
      # firmware.bin about to be staged. Everything it reports is derived from
      # the configuration, so the files it names need not exist yet.
      - name: Collect PlatformIO build metadata
        run: |
          args=()
          for env_name in $RELEASE_ENVS; do
            args+=("-e" "$env_name")
          done
          python -m platformio project metadata "${args[@]}" --json-output-path metadata.json

      - name: Build gateway firmware
        run: |
          for env_name in $RELEASE_ENVS; do
            echo "::group::Build $env_name"
            python -m platformio run -e "$env_name"
            echo "::endgroup::"
          done

      # Stages two files per environment: the application image, and a merged
      # factory image for USB flashing and the web flasher -- plus an
      # assets.json sidecar that spares consumers from parsing filenames. The
      # bootloader, partition table and OTA selector go into the merge but are
      # not published on their own; the sidecar's `parts` list records where
      # each of them sits. See scripts/release_artifacts.py.
      - name: Stage release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_ENVS: ${{ env.RELEASE_ENVS }}
        run: |
          args=()
          for env_name in $RELEASE_ENVS; do
            args+=("--env" "$env_name")
          done
          python scripts/stage_release_artifacts.py \
            --version "$RELEASE_VERSION" \
            --metadata metadata.json \
            "${args[@]}"

      - name: Commit release metadata
        run: |
          git add version.json
          if git diff --cached --quiet; then
            echo "Release metadata did not change"
          else
            git commit -m "Release v${{ steps.release_version.outputs.version }}"
          fi

      - name: Create and push release tag
        run: |
          git tag "${{ steps.release_version.outputs.tag }}"
          git push origin "HEAD:${{ inputs.target_branch }}" --follow-tags

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: racelink_gateway_release
          if-no-files-found: error
          path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ inputs.target_branch }}
          generate_release_notes: true
          body: |
            ### Flashing

            The easiest route for a blank board is the web flasher at
            <https://fw.racelink.dev/>, which picks the right image for the
            model and sets the radio channel while it writes. The files below
            are for flashing by hand.

            * `<env>-<version>-ota.bin` — application image. This is the file
              for OTA updates and for the host's firmware-update dialog.
            * `<env>-<version>-usbflash.bin` — bootloader, partition table, OTA
              selector and application in one image, written at offset `0x0`.
              **USB serial only.** Sent over OTA it is rejected in the normal
              case, but with firmware validation disabled it is written into the
              inactive slot and bricks the device until someone re-flashes over
              serial. It also rewrites the partition table, so every persisted
              setting is erased — a commissioning tool, never an update tool.
              Requires a chip with at least 8 MB of flash.
            * `…-assets.json` — machine-readable index: environment, chip,
              device type, flash offset, size and SHA-256 for every file, plus
              a `parts` list giving the layout of the blocks merged into the
              factory image.

            Filenames no longer repeat the product, the device type or the
            checksum file; every one of those is in `…-assets.json`. The
            bootloader, partition table and OTA selector are no longer published
            separately — `esptool write_flash 0x0 <env>-<version>-usbflash.bin`
            reaches the same state in one write.
          files: dist/*

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo
            echo "- Gateway version: \`${{ steps.release_version.outputs.version }}\`"
            echo "- Gateway tag: \`${{ steps.release_version.outputs.tag }}\`"
            echo "- PlatformIO environments: \`${{ env.RELEASE_ENVS }}\`"
            echo "- Trigger: \`workflow_dispatch\`"
            echo
            echo "### Published assets"
            echo
            echo "| File | Kind | Offset | SHA-256 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          manifest = json.loads(
              next(Path("dist").glob("*-assets.json")).read_text(encoding="utf-8")
          )
          for environment in manifest["environments"]:
              for asset in environment["assets"]:
                  print(
                      f"| `{asset['file']}` | {asset['kind']} | "
                      f"0x{asset['offset']:x} | `{asset['sha256'][:16]}…` |"
                  )
          PY
